[package]
name = "libimgvwr"
version.workspace = true
description = "Core library for the imgvwr image viewer"
edition.workspace = true
license.workspace = true
readme = "../README.md"
repository.workspace = true

[features]
default = ["png"]
png = ["image/png"]
jpeg = ["image/jpeg"]
webp = ["image/webp"]
avif = ["dep:zenavif", "dep:zenpixels-convert"]
jxl = ["dep:jxl"]
jxl-anim = ["jxl"]
gif = ["image/gif"]
avif-anim = ["avif"]
webp-anim = ["webp"]
apng = ["png"]
decorations = []
gpu-vulkan = ["dep:wgpu", "dep:vello", "dep:pollster", "wgpu/vulkan", "wgpu/wgsl"]
gpu-gles = ["dep:wgpu", "dep:vello", "dep:pollster", "wgpu/gles", "wgpu/wgsl"]
dmabuf = ["gpu-vulkan", "dep:raw-window-handle"]

[dependencies]
image = { version = "0.25", default-features = false }
tracing = "0.1"
memmap2 = "0.9"
rustix = { version = "1", features = ["fs", "event", "time"] }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
xkbcommon = "0.9"
wgpu = { version = "30", optional = true, default-features = false, features = ["wgsl", "vulkan", "gles"] }
vello = { version = "0.12", optional = true, default-features = false, features = ["wgpu"] }
raw-window-handle = { version = "0.6", optional = true }
pollster = { version = "1", optional = true }
jxl = { version = "0.8", optional = true, default-features = false }
zenavif = { version = "0.1.6", optional = true }
zenpixels-convert = { version = "0.2", optional = true, default-features = false, features = ["rgb"] }

[dev-dependencies]
tempfile = "3"
